<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>數學偵探社 · 澳門大富翁（4 人．簡便運算）</title>
<style>
:root{
  --ink:#2b4a63; --ink2:#7b93a8; --line:#d9e9f6;
  --candy:#ffcf5c; --candy2:#ffb02e;
  --p1:#ff6b81; --p2:#4d9de0; --p3:#3ec98a; --p4:#ffb43a;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Baloo 2","Comic Sans MS","PingFang SC","Microsoft JhengHei","Noto Sans TC",system-ui,sans-serif;
  color:var(--ink);min-height:100vh;padding-bottom:96px;
  background:#ffffff;
}
body::before{display:none}

/* ---------- 頂欄 ---------- */
.top{
  position:relative;z-index:60;display:flex;align-items:center;justify-content:space-between;
  gap:10px;padding:12px 20px 6px;max-width:1500px;margin:0 auto;
}
.brand{display:flex;align-items:center;gap:10px}
.logo{
  width:46px;height:46px;border-radius:16px;display:grid;place-items:center;font-size:24px;
  background:linear-gradient(180deg,#fff2c8,#ffcf5c);
  border:3px solid #ffb02e;
  box-shadow:0 5px 0 #e8931f,0 9px 14px rgba(200,130,20,.28),inset 0 2px 0 #fff;
}
.brand h1{margin:0;font-size:19px;letter-spacing:.6px;color:#22506f;text-shadow:0 1px 0 #fff}
.brand p{margin:2px 0 0;font-size:11.5px;color:#6f8ba1;font-weight:700}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.pill{
  background:linear-gradient(180deg,#fff,#eef8ff);border:2.5px solid #cfe7f8;border-radius:999px;
  padding:6px 13px;font-size:13px;font-weight:800;color:#2b6285;white-space:nowrap;
  box-shadow:0 3px 0 #dcecf8;
}
.pill.warn{border-color:#ffc2cc;background:linear-gradient(180deg,#fff,#fff0f3);color:#d43a52;box-shadow:0 3px 0 #ffd3db}
.ghost{
  background:linear-gradient(180deg,#fff,#f2f9ff);border:2.5px solid #d5e9f8;border-radius:999px;
  padding:6px 14px;font:inherit;font-size:12.5px;font-weight:800;color:#2b6285;cursor:pointer;
  box-shadow:0 3px 0 #dfeef8;
}
.ghost:active{transform:translateY(2px);box-shadow:0 1px 0 #dfeef8}

/* ---------- 音量控制 ---------- */
.volwrap{position:relative}
.volpop{
  position:absolute;top:calc(100% + 9px);right:0;z-index:80;display:none;min-width:214px;
  background:linear-gradient(180deg,#fff,#f4fbff);border:2.5px solid #cfe7f8;border-radius:16px;
  padding:10px 13px 8px;box-shadow:0 6px 0 #dcecf8,0 14px 28px rgba(40,95,135,.18);
}
.volpop.on{display:block}
.volpop::before{
  content:'';position:absolute;top:-7px;right:22px;width:12px;height:12px;
  background:#fff;border-left:2.5px solid #cfe7f8;border-top:2.5px solid #cfe7f8;
  transform:rotate(45deg);border-radius:3px 0 0 0;
}
.vrow{display:flex;align-items:center;gap:8px;font-size:12px;font-weight:800;color:#2b6285;margin:7px 0}
.vrow span{width:56px;white-space:nowrap;flex:none}
.vrow b{width:26px;text-align:right;font-size:11.5px;color:#7c96ab;flex:none}
.vrow input[type=range]{flex:1;min-width:0;accent-color:#3a86d2;cursor:pointer;height:22px}

/* ---------- 棋盤 ---------- */
.stage{
  position:relative;z-index:2;display:grid;
  grid-template-columns:auto minmax(258px,clamp(276px,24vw,344px));
  justify-content:center;
  gap:clamp(12px,1.6vw,22px);align-items:stretch;
  max-width:1500px;margin:8px auto 0;padding:0 16px;
}
.boardwrap{
  position:relative;width:calc(100dvh - 168px);
  max-width:100%;
  justify-self:center;align-self:start;
}
.board{
  position:relative;display:grid;grid-template-columns:repeat(7,1fr);grid-template-rows:repeat(7,1fr);
  gap:5px;aspect-ratio:1;width:100%;
  padding:11px;border-radius:28px;
  background:
    radial-gradient(circle at 18% 12%, rgba(255,255,255,.85) 0 10%, transparent 55%),
    linear-gradient(160deg,#b6e3f8,#83c9ec 55%,#6fbde6);
  border:4px solid #ffffff;
  box-shadow:0 10px 0 #58a9d4,0 22px 40px rgba(35,105,145,.3),inset 0 3px 0 rgba(255,255,255,.9);
}

/* ---------- 格子 ---------- */
.tile{
  position:relative;border-radius:13px;padding:3px 2px 15px;min-width:0;min-height:0;overflow:hidden;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;
  --tys:clamp(3px,.55vw,8px);
  background:linear-gradient(180deg,#ffffff,#f1f9ff);
  border:2px solid #d3e8f6;
  box-shadow:0 3px 0 #cfe3f1,0 5px 9px rgba(38,95,130,.12),inset 0 1px 0 #fff;
  transition:background .25s,border-color .25s,transform .18s;
}
.tile .ic{
  font-size:clamp(16px,2vw,34px);line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.14));
  transform:translateY(var(--tys,0px));
}
.tile .nm{
  font-size:clamp(8px,.95vw,15px);font-weight:800;color:#37627f;text-align:center;
  line-height:1.1;max-width:100%;overflow-wrap:anywhere;
  transform:translateY(var(--tys,0px));
}
.tile .tp{
  position:absolute;top:1px;left:2px;z-index:3;max-width:calc(100% - 26px);
  font-size:clamp(6.5px,.78vw,12px);font-weight:800;color:#7c96ab;letter-spacing:.2px;
  line-height:1.2;text-align:left;white-space:nowrap;
  padding:0 3px;border-radius:7px;background:rgba(255,255,255,.82);
  box-shadow:0 0 0 1px rgba(255,255,255,.6);
  text-shadow:0 1px 0 #fff;pointer-events:none;
}
.tile.t-start{
  background:linear-gradient(180deg,#fffdf0,#ffe9a8);border-color:#f5cf66;
  box-shadow:0 3px 0 #e8bb45,0 5px 9px rgba(180,140,30,.2),inset 0 1px 0 #fff;
}
.tile.t-start .nm{color:#8a6100}
.tile.t-luck{
  background:linear-gradient(180deg,#eafdff,#a8e9f4);border-color:#37bdd2;
  box-shadow:0 3px 0 #4cc9dc,0 5px 9px rgba(20,120,150,.16),inset 0 1px 0 #fff;
}
.tile.t-luck .nm{color:#0b6376}
.tile.t-fate{
  background:linear-gradient(180deg,#fbf7ff,#e9e1fb);border-color:#c3b0ea;
  box-shadow:0 3px 0 #d2c3f0,0 5px 9px rgba(90,60,150,.14),inset 0 1px 0 #fff;
}
.tile.own0{background:linear-gradient(180deg,#fff2f5,#ffc2d1);border-color:#f0506b;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 3px 0 #e8475f,0 5px 9px rgba(214,51,108,.22)}
.tile.own1{background:linear-gradient(180deg,#f0f8ff,#c2dcff);border-color:#3a86d2;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 3px 0 #2f7cbd,0 5px 9px rgba(26,95,180,.22)}
.tile.own2{background:linear-gradient(180deg,#effdf6,#bdeed7);border-color:#22b573;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 3px 0 #1fa068,0 5px 9px rgba(30,150,100,.22)}
.tile.own3{background:linear-gradient(180deg,#fffaf0,#ffe0a8);border-color:#ef9a12;
  box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.85),0 3px 0 #d98a10,0 5px 9px rgba(200,140,20,.22)}
.tile.own0 .nm,.tile.own1 .nm,.tile.own2 .nm,.tile.own3 .nm{color:#2a4256}
.tile.own0 .tp,.tile.own1 .tp,.tile.own2 .tp,.tile.own3 .tp{color:#4a6274}
/* 所有格子統一預留底部棋子空間，圖示與地名才會橫向對齊（見 .tile padding-bottom） */
.tile .tk{
  position:absolute;bottom:0;left:0;right:0;display:flex;gap:1px;justify-content:center;
  flex-wrap:wrap;padding:0 1px;
}
.av{
  width:clamp(13px,1.42vw,19px);height:clamp(13px,1.42vw,19px);border-radius:50%;
  background:var(--c,#ccc);border:2px solid #fff;display:grid;place-items:center;
  font-size:clamp(7px,.94vw,11.5px);line-height:1;font-style:normal;
  box-shadow:0 0 0 2px var(--c,#ccc),0 0 0 3.5px rgba(255,255,255,.9),0 3px 6px rgba(15,45,75,.35);
  animation:bob 1.8s ease-in-out infinite;
}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}

/* 立體小屋 */
.house{
  position:absolute;top:3px;right:3px;width:19px;height:18px;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
  filter:drop-shadow(0 2px 2px rgba(40,80,110,.28));pointer-events:none;
  transform:scale(var(--hs,1));transform-origin:100% 100%;
}
.house .roof{
  width:0;height:0;border-left:9.5px solid transparent;border-right:9.5px solid transparent;
  border-bottom:8px solid var(--c);margin-bottom:-1px;
}
.house .wall{
  width:16px;height:9px;border-radius:1px 1px 4px 4px;position:relative;
  background:linear-gradient(180deg,#fff,#e3edf7);
  box-shadow:inset -2px -2px 0 rgba(70,110,140,.1);
}
.house .wall::after{
  content:"";position:absolute;left:5.5px;bottom:0;width:4.5px;height:5.5px;
  background:var(--c);opacity:.65;border-radius:2px 2px 0 0;
}
/* 第 1 階段：只有地權 —— 一支小旗 */
.house.s1 .post{width:3px;height:14px;background:#b9813c;border-radius:2px;
  box-shadow:0 0 0 1px rgba(255,255,255,.9),inset -1px 0 0 rgba(0,0,0,.18)}
.house.s1 .flag{position:absolute;left:50%;top:0;margin-left:1px;width:8px;height:7px;
  background:var(--c);border-radius:1px 4px 4px 1px;
  clip-path:polygon(0 0,100% 50%,0 100%);
  filter:drop-shadow(0 0 1.5px rgba(255,255,255,.95)) drop-shadow(0 1px 2px rgba(0,0,0,.25))}
/* 第 3 階段：普通住宅 —— 兩層雙窗 */
.house.s3{right:6px;top:7px;transform:scale(calc(1.1 * var(--hs,1)));transform-origin:100% 100%}
.house.s3 .wall{height:12px;background:linear-gradient(180deg,#fff,#dfeefb)}
.house.s3 .wall::after{left:3.5px;bottom:1px;box-shadow:6.5px 0 0 var(--c)}
/* 第 4 階段：豪宅 —— 金頂 + 星章 */
.house.s4{right:7px;top:5px;transform:scale(calc(1.2 * var(--hs,1)));transform-origin:100% 100%;
  filter:drop-shadow(0 2px 3px rgba(40,80,110,.3)) drop-shadow(0 0 5px rgba(255,190,40,.9))}
.house.s4 .roof{border-bottom-color:#ffc22e;filter:drop-shadow(0 0 3px rgba(255,196,60,.95))}
.house.s4 .wall{background:linear-gradient(180deg,#fffdf3,#ffe6ae);
  box-shadow:inset -2px -2px 0 rgba(210,160,40,.25)}
/* 第 5 階段：商場 —— 藍玻璃幕牆 + 購物章 */
.house.s5{right:6px;top:4px;transform:scale(calc(1.32 * var(--hs,1)));transform-origin:100% 100%;
  filter:drop-shadow(0 2px 3px rgba(40,80,110,.32)) drop-shadow(0 0 5px rgba(90,180,255,.85))}
.house.s5 .roof{border-bottom-color:#59b7f5;filter:drop-shadow(0 0 3px rgba(90,180,250,.95))}
.house.s5 .wall{width:19px;height:12px;border-radius:2px 2px 4px 4px;
  background:linear-gradient(180deg,#eaf7ff,#bfe3fb);box-shadow:inset -2px -2px 0 rgba(60,130,190,.22)}
.house.s5 .wall::after{left:3px;bottom:1.5px;width:13px;height:3px;border-radius:2px;
  background:linear-gradient(90deg,#59b7f5,#8fd0ff);opacity:.95}
/* 第 6 階段：豪華度假村 —— 珍珠白 + 棕櫚章，全場最大 */
.house.s6{right:5px;top:3px;transform:scale(calc(1.45 * var(--hs,1)));transform-origin:100% 100%;
  filter:drop-shadow(0 2px 3px rgba(40,80,110,.34)) drop-shadow(0 0 6px rgba(255,150,220,.85))}
.house.s6 .roof{border-bottom-color:#ff8fcf;filter:drop-shadow(0 0 4px rgba(255,150,210,.95))}
.house.s6 .wall{width:21px;height:13px;border-radius:3px 3px 5px 5px;
  background:linear-gradient(180deg,#fff,#ffe9f4);box-shadow:inset -2px -2px 0 rgba(220,110,170,.22)}
.house.s6 .wall::after{left:3.5px;bottom:1.5px;width:14px;height:4px;border-radius:2px;
  background:linear-gradient(90deg,#ff8fcf,#ffc2e4);opacity:.95}
.house .crown{position:absolute;top:-8px;left:50%;transform:translateX(-50%);
  font-size:8px;line-height:1;color:#f0a500;text-shadow:0 1px 0 #fff}
.house.s5 .crown,.house.s6 .crown{font-size:9px;top:-10px}

/* ---------- 中央面板 ---------- */
.panel{
  position:relative;
  border-radius:24px;padding:16px 16px 14px;display:flex;flex-direction:column;gap:10px;
  overflow:hidden;max-height:calc(100dvh - 168px);
  background:linear-gradient(180deg,#fffdf7,#fff0d5);
  border:4px solid #f7d489;color:#6b4a12;
  box-shadow:0 8px 0 #eec06a,0 16px 26px rgba(150,105,20,.22),inset 0 3px 0 #fff;
}
.ptitle{
  display:flex;align-items:center;gap:6px;font-size:14.5px;font-weight:800;color:#8a5a10;
  letter-spacing:.3px;
}
.ptitle .ms{font-size:19px;filter:drop-shadow(0 2px 2px rgba(0,0,0,.15))}
.ptitle em{margin-left:auto;font-style:normal;font-size:10px;font-weight:800;color:#b8892f;
  background:#fff6e0;border:1.5px solid #f0d69a;border-radius:999px;padding:2px 7px}
.prow{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.pcard{
  background:linear-gradient(180deg,#fff,#fffaf0);border:2.5px solid #f1dcb4;border-radius:13px;
  padding:5px 8px;min-width:0;transition:.2s;box-shadow:0 3px 0 #f3e3c6;
}
.pcard.on{
  border-color:#ffb02e;background:linear-gradient(180deg,#fffdf3,#ffeec4);
  box-shadow:0 3px 0 #efc069,0 0 0 3px rgba(255,176,46,.28);transform:translateY(-1px);
}
.pcard.out{opacity:.45;filter:grayscale(1)}
.pn{display:flex;align-items:center;gap:5px;font-size:11.5px;font-weight:800;color:#7a5320;white-space:nowrap}
.pn .mini{
  width:17px;height:17px;border-radius:50%;background:#fff;border:2px solid var(--c);
  display:grid;place-items:center;font-size:9px;flex:0 0 auto;
}
.pc{font-size:17px;font-weight:800;line-height:1.15;color:#5c3d0c;letter-spacing:.2px}
.pm{font-size:9.5px;font-weight:700;color:#b08a52;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dicewrap{
  display:flex;align-items:center;justify-content:center;gap:clamp(8px,1vw,14px);flex-wrap:wrap;
  padding:clamp(11px,1.3vw,18px) 12px;border-radius:18px;
  background:linear-gradient(180deg,#f8fdff,#e6f4ff);
  border:2.5px solid #cfe7f8;
  box-shadow:inset 0 2px 0 #fff,0 3px 0 #dfeef8;
}
.die{
  width:clamp(38px,3.3vw,56px);height:clamp(38px,3.3vw,56px);border-radius:14px;
  background:linear-gradient(180deg,#fff,#eef7ff);
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);
  padding:5px;gap:1px;border:2px solid #d6e8f6;
  box-shadow:0 4px 0 #cfe4f4,0 6px 10px rgba(40,90,120,.16);
}
.die i{width:100%;aspect-ratio:1;border-radius:50%;background:#3b6785;visibility:hidden;
  align-self:center;justify-self:center;max-width:7px;max-height:7px}
.die i.on{visibility:visible}
.die.rolling{animation:shake .32s linear infinite}
@keyframes shake{0%,100%{transform:rotate(-7deg) translateY(0)}50%{transform:rotate(7deg) translateY(-4px)}}
.roll{
  border:0;border-radius:16px;padding:13px 22px;font:inherit;font-size:15.5px;font-weight:800;
  color:#7a4a00;cursor:pointer;white-space:nowrap;
  background:linear-gradient(180deg,#ffe089,#ffb02e);
  box-shadow:0 5px 0 #e08d16,0 9px 16px rgba(224,141,22,.35),inset 0 2px 0 #fff5cf;
}
.roll:not(:disabled):active{transform:translateY(4px);box-shadow:0 1px 0 #e08d16,inset 0 2px 0 #fff5cf}
.roll:disabled{opacity:.5;cursor:not-allowed;box-shadow:0 5px 0 #d9c9a8}
.hint{
  font-size:11.5px;line-height:1.45;text-align:center;font-weight:700;color:#8a641f;
  min-height:16px;padding:6px 8px;border-radius:11px;background:rgba(255,255,255,.6);
  border:1.5px solid #f3e3c6;
}
.hint b{color:#c0561c}

/* ---------- 彈窗 ---------- */
.overlay{
  position:fixed;inset:0;z-index:60;display:none;padding:14px 14px 92px;overflow:auto;
  background:rgba(24,60,88,.55);backdrop-filter:blur(4px);
}
.overlay.show{display:flex;align-items:center;justify-content:center}
.sheet{
  width:min(470px,100%);border-radius:26px;padding:18px;position:relative;
  background:linear-gradient(180deg,#ffffff,#f7fcff);
  border:4px solid #fff;
  box-shadow:0 12px 0 #cfe6f6,0 22px 44px rgba(20,60,90,.4),inset 0 2px 0 #fff;
  animation:pop .22s cubic-bezier(.2,1.4,.5,1) both;
}
@keyframes pop{from{transform:scale(.9) translateY(10px);opacity:0}to{transform:none;opacity:1}}

.qtop{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-bottom:9px}
.qbadge{
  font-size:10.5px;font-weight:800;color:#fff;border-radius:999px;padding:4px 10px;
  letter-spacing:.3px;white-space:nowrap;box-shadow:0 2px 0 rgba(0,0,0,.14);
}
.qbadge.d{background:linear-gradient(180deg,#7bc6f5,#4d9de0)}
.qbadge.p{background:linear-gradient(180deg,#ffb0c0,#ff6b81)}
.qbadge.f{background:linear-gradient(180deg,#7fe0b4,#3ec98a)}
.qbadge.m{background:linear-gradient(180deg,#bda6ff,#7c5cf0)}
.qbadge.buy{background:linear-gradient(180deg,#7fe0b4,#2aa86e)}
.qbadge.rent{background:linear-gradient(180deg,#ffab8f,#e8523a)}
.qbadge.up{background:linear-gradient(180deg,#ffd88a,#e8951a)}
.qwhere{font-size:11.5px;color:#7b93a8;font-weight:800}
.qtext{font-size:16px;line-height:1.6;font-weight:800;color:#22496f;margin:2px 0 4px}
.qsub{font-size:11.5px;color:#8aa2b6;font-weight:700;margin-bottom:11px}

.fr{
  display:inline-flex;flex-direction:column;justify-content:center;
  vertical-align:middle;position:relative;top:-.16em;
  text-align:center;font-size:.78em;line-height:1;margin:0 3px;font-weight:800;
}
.fr b{border-bottom:1.6px solid currentColor;padding:0 3px 1px;line-height:1.06}
.fr i{font-style:normal;padding:1px 3px 0;line-height:1.06}

.opts{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.opt{
  position:relative;border:2.5px solid #dbe9f7;border-radius:16px;padding:13px 6px 11px;
  font:inherit;font-size:20px;font-weight:800;color:#1c3f5e;cursor:pointer;
  background:linear-gradient(180deg,#fff,#f2f9ff);
  box-shadow:0 4px 0 #dbe9f5,inset 0 2px 0 #fff;transition:.12s;
}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #dbe9f5}
.opt .lt{
  position:absolute;left:7px;top:4px;font-size:9.5px;font-weight:800;color:#b7cad9;
}
.opt.ok{
  background:linear-gradient(180deg,#e9fff2,#c6f5d9);border-color:#4ec183;
  box-shadow:0 4px 0 #8ddab0,inset 0 2px 0 #fff;color:#0d6a3e;
}
.opt.no{
  background:linear-gradient(180deg,#ffedf0,#ffd4dc);border-color:#ef8fa0;
  box-shadow:0 4px 0 #f3b7c1,inset 0 2px 0 #fff;color:#9c2036;
}
.opt:disabled{cursor:default}

/* ---------- 答題倒數 ---------- */
.qtimer{display:flex;align-items:center;gap:9px;margin:10px 0 4px}
.qtimebar{
  flex:1;min-width:0;height:13px;border-radius:999px;background:#e3eef7;
  border:2px solid #cfe3f2;overflow:hidden;box-shadow:inset 0 1px 2px rgba(30,80,120,.12);
}
.qtimebar i{
  display:block;height:100%;width:100%;border-radius:999px;
  background:linear-gradient(90deg,#39c26d,#7fe08a);
  transition:width .95s linear,background .4s;
}
.qtimebar i.warn{background:linear-gradient(90deg,#ffb02e,#ffd166)}
.qtimebar i.danger{background:linear-gradient(90deg,#f0506b,#ff7b8a)}
.qtsec{
  flex:none;min-width:46px;text-align:right;font-weight:800;font-size:16px;color:#2b6285;
  font-variant-numeric:tabular-nums;
}
.qtsec.warn{color:#d97a00}
.qtsec.danger{color:#d43a52}

.btn{
  display:block;width:100%;border:0;border-radius:16px;padding:14px;font:inherit;
  font-size:15px;font-weight:800;cursor:pointer;margin-top:11px;color:#0d4a78;

/* ---------------- 題目 / 選項 ---------------- */
function drawQ() {
  if (S.poolAt >= S.pool.length) { S.pool = shuffle(QS.map((q, i) => i)); S.poolAt = 0; }
  return QS[S.pool[S.poolAt++]];
}
function evalQ(q) {
  const v = Function('return (' + q.e + ')')();
  const r = Math.round(v * 100) / 100;
  return Math.abs(r) < 1e-9 ? 0 : r;
}
function ansText(v) {
  if (Math.abs(v - Math.round(v)) < 1e-9) return String(Math.round(v));
  return (Math.round(v * 100) / 100).toFixed(2).replace(/0$/, '');
}

/* 產生 3 個「像真」的錯誤選項：小數點移位、倍數、加減十位 */
function makeOptions(ans) {
  const picked = [];
  const valid = v => {
    const r = Math.round(v * 100) / 100;
    if (!isFinite(r) || r < 0 || r > 999999) return false;
    if (Math.abs(r - ans) < 0.005) return false;
    return !picked.some(x => Math.abs(x - r) < 0.005);
  };
  const add = v => {
    if (!valid(v)) return false;
    picked.push(Math.round(v * 100) / 100);
    return true;
  };

  if (Math.abs(ans) < 0.6) {
    for (const v of shuffle([1, 0.5, 2, 0.25, 3])) { if (picked.length >= 3) break; add(v); }
  } else {
    // 三類最常見的錯誤：小數點移位、倍數、加減一成
    const groups = [
      [ans * 10, ans / 10],
      [ans * 2, ans / 2],
      [ans * 1.1, ans * 0.9, ans + 10, ans - 10]
    ];
    for (const g of groups) {
      if (picked.length >= 3) break;
      for (const v of shuffle(g)) { if (add(v)) break; }
    }
  }
  let k = 1;
  while (picked.length < 3) { add(ans + k); k++; }
  return shuffle(picked.concat([ans]));
}

/* ---------------- 音效與背景音樂 ---------------- */
let AC = null;
function ac() {
  try {
    if (!AC) AC = new (window.AudioContext || window.webkitAudioContext)();
    if (AC.state === 'suspended') AC.resume();
  } catch (e) { }
  return AC;
}
/* 音量：特效 / 音樂 各自獨立，存 localStorage */
let sfxVol = 0.8, bgmVol = 0.8;
let sfxBus = null, bgmBus = null;
try {
  const a = parseFloat(localStorage.getItem('mbm_sfx')); if (!isNaN(a)) sfxVol = a;
  const b = parseFloat(localStorage.getItem('mbm_bgm')); if (!isNaN(b)) bgmVol = b;
} catch (e) { }
function audioBuses() {
  const a = ac();
  if (!a) return null;
  if (!sfxBus) {
    sfxBus = a.createGain(); sfxBus.gain.value = sfxVol; sfxBus.connect(a.destination);
    bgmBus = a.createGain(); bgmBus.gain.value = bgmVol; bgmBus.connect(a.destination);
  }
  return a;
}
function setSfxVol(v) {
  sfxVol = Math.max(0, Math.min(1, v));
  if (sfxBus) sfxBus.gain.value = sfxVol;
  try { localStorage.setItem('mbm_sfx', sfxVol); } catch (e) { }
}
function setBgmVol(v) {
  bgmVol = Math.max(0, Math.min(1, v));
  if (bgmBus) bgmBus.gain.value = bgmVol;
  try { localStorage.setItem('mbm_bgm', bgmVol); } catch (e) { }
}
function tone(freq, dur, type, vol, delay) {
  const a = ac();
  if (!a || sfxVol <= 0) return;
  audioBuses();
  const t0 = a.currentTime + (delay || 0);
  const o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(vol || 0.06, t0 + 0.012);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(sfxBus);
  o.start(t0); o.stop(t0 + dur + 0.03);
}

/* ---------------- 背景音樂：柔和搖籃曲風（WebAudio 即時生成） ---------------- */
let bgmPlaying = false, bgmTimer = null, bgmBar = 0;
const BGM_CHORDS = [
  [261.63, 329.63, 392.00],   /* C */
  [220.00, 261.63, 329.63],   /* Am */
  [174.61, 220.00, 261.63],   /* F */
  [196.00, 246.94, 293.66]    /* G */
];
const BGM_PENTA = [523.25, 587.33, 659.25, 783.99, 880.00, 1046.50];
function bgmPad(freq, dur, delay) {
  const a = AC; if (!a || !bgmBus || bgmVol <= 0) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'sine'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(0.042, t0 + 0.9);
  g.gain.setValueAtTime(0.042, t0 + Math.max(0.9, dur - 0.9));
  g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(bgmBus);
  o.start(t0); o.stop(t0 + dur + 0.05);
}
function bgmPluck(freq, delay) {
  const a = AC; if (!a || !bgmBus || bgmVol <= 0) return;
  const t0 = a.currentTime + delay;
  const o = a.createOscillator(), g = a.createGain();
  o.type = 'triangle'; o.frequency.value = freq;
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.exponentialRampToValueAtTime(0.072, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.9);
  o.connect(g); g.connect(bgmBus);
  o.start(t0); o.stop(t0 + 1);
}
function bgmScheduleBar() {
  const a = AC; if (!a || !bgmBus) return;
  const chord = BGM_CHORDS[bgmBar % BGM_CHORDS.length];
  bgmPad(chord[0] / 2, 4.4, 0);            /* 低音鋪底 */
  chord.forEach(f => bgmPad(f, 4.4, 0));
  /* 旋律：和弦音琶行 + 偶爾五聲音階點綴 */
  const seq = [0, 1, 2, 1, 2, 1, 0, 2];
  for (let i = 0; i < 8; i++) {
    let n = chord[seq[i]] * (i === 4 ? 2 : 1);
    if (i === 6 && Math.random() < 0.5) n = BGM_PENTA[(Math.random() * BGM_PENTA.length) | 0];
    bgmPluck(n, i * 0.48 + Math.random() * 0.04);
  }
  bgmBar++;
}
function bgmStart() {
  const a = audioBuses();
  if (!a || bgmPlaying) return;
  bgmPlaying = true;
  if (AC.state === 'suspended') AC.resume();
  bgmScheduleBar();
  bgmTimer = setInterval(() => { if (bgmPlaying) bgmScheduleBar(); }, 4400);
}
function bgmStop() {
  bgmPlaying = false;
  if (bgmTimer) { clearInterval(bgmTimer); bgmTimer = null; }
}
/* 切回分頁時重新對拍，避免音符一次湧出 */
document.addEventListener('visibilitychange', () => {
  if (!document.hidden && bgmPlaying) { bgmStop(); bgmStart(); }

function payMoney(p, amt, quiet) {
  p.cash -= amt;
  const sold = [];
  while (p.cash < 0 && p.lands.length) {
    const sorted = p.lands.slice().sort((a, b) => TILES[a].price - TILES[b].price);
    const idx = sorted[0];
    const back = Math.round(TILES[idx].price * SELL_RATE);
    p.cash += back;
    p.lands = p.lands.filter(x => x !== idx);
    TILES[idx].stage = 0;
    sold.push(TILES[idx].nm);
    updateBoard();
  }
  if (p.cash < 0) {
    p.cash = 0; p.out = true;
    S.endAfter = { type: 'bankrupt', who: p };
    setHint(`💥 <b>${p.name}</b> 現金見底，土地亦抵押光了 —— 破產出局，遊戲即時結算。`);
    logEvent('💥 <b>' + p.name + '</b> 破產出局，提早結束並即時結算');
  }
  renderPlayers();
  if (!quiet) { moneyFloat(p.i, -amt); SFX.pay(); }
  return sold;
}

    const kb = { d: '小數', p: '百分數', f: '分數', m: '互化巧算' }[q.k];

    /* 倒數時限：2 個數 30 秒、3 個數 40 秒 */
    const numCount = (q.s.match(/\[\[\d+\/\d+\]\]|\d+(?:\.\d+)?%?/g) || []).length;
    const limit = numCount >= 3 ? 40 : 30;
    let timeLeft = limit, qTimerId = null;
    const paintTimer = () => {
      const tb = document.querySelector('#qtb'), ts = document.querySelector('#qtsec');
      if (!tb || !ts) return;

      tb.className = cls; ts.className = 'qtsec ' + cls;
    };
    const stopTimer = () => { if (qTimerId) { clearInterval(qTimerId); qTimerId = null; } };
    const finish = (ok, timedOut) => {
      answered = true;
      stopTimer();
      if (cfg.p) { if (ok) cfg.p.qOk++; else cfg.p.qNo++; }
      document.querySelectorAll('.opt').forEach((el, j) => {
        el.disabled = true;
        if (Math.abs(opts[j] - ans) < 0.005) el.classList.add('ok');
      });
      if (!ok) {

      feed.className = 'feed show ' + (ok ? 'ok' : 'no');
      feed.innerHTML = '<b>' + (ok ? '✅ 答對了！' : timedOut ? '⏰ 時間到！' : '❌ 答錯了') + '</b>'
        + '<span class="calc">正確答案：' + ansText(ans) + (q.u ? ' ' + q.u : '') + '　｜　' + frac(q.c) + '</span>'
        + cfg.onAnswer(ok);
      const nx = $('#qnext');
      nx.style.display = 'block';
      nx.textContent = '繼續';
      nx.onclick = () => { closeSheet(); resolve({ ok, ans, q, timeout: !!timedOut }); };
    };

    const optHtml = opts.map((v, i) =>
      '<button class="opt" data-i="' + i + '" data-v="' + v + '"><span class="lt">' + 'ABCD'[i] + '</span>'
      + ansText(v)
      + (q.u ? '<span style="font-size:12px;color:#8aa2b6;margin-left:3px">' + q.u + '</span>' : '')
      + '</button>').join('');

    openSheet(`
      <div class="qtop">
        <span class="qbadge ${q.k}">${kb}</span>
        <span class="qbadge ${cfg.kind}">${cfg.label || (cfg.kind === 'rent' ? '付過路費' : '買地')}</span>
        <span class="qwhere">${cfg.tile.ic} ${cfg.tile.nm}　·　${cfg.who}</span>
      </div>
      <div class="qtext">${frac(q.s)}</div>
      <div class="qsub">${cfg.sub}</div>
      <div class="qtimer">
        <div class="qtimebar"><i id="qtb"></i></div>
        <span class="qtsec" id="qtsec">${limit}s</span>
      </div>
      <div class="opts" id="opts">${optHtml}</div>
      <div class="feed" id="qfeed"></div>
      <button class="btn alt" id="qnext" style="display:none">繼續</button>
    `);

    let curPick = -1;
    $('#opts').addEventListener('click', e => {
      const b = e.target.closest('.opt');
      if (!b || answered) return;
      curPick = +b.dataset.i;
      finish(Math.abs(opts[curPick] - ans) < 0.005, false);
    });

    paintTimer();
    qTimerId = setInterval(() => {
      if (answered) { stopTimer(); return; }
      timeLeft--;
      paintTimer();
      if (timeLeft <= 5 && timeLeft > 0) tone(920, .05, 'sine', .025, 0);
      if (timeLeft <= 0) finish(false, true);
    }, 1000);
  });
}

function askInvest(p, idx, t, target) {
  return new Promise(resolve => {
    const info = STAGE_INFO[target];
    const cost = stageCost(t, target);
    const now = t.stage > 0 ? rentAt(t, t.stage) : 0;
    const next = rentAt(t, target);
    const canPay = p.cash >= cost;
    const stName = STAGE_NAME[t.stage] || '空地';
    const nextTotal = investedIn(t) + (target <= (t.stage || 1) ? 0 : cost);
    const cumPct = Math.round(nextTotal / t.price * 100);

    openSheet(`
      <div class="hero">
        <div class="em">${info.em}</div>
        <h2>${info.title}</h2>
        <p>${t.nm}　現況：${t.stage ? stName + '（第 ' + t.stage + ' 階段 / 共 ' + MAX_STAGE + ' 階段）' : '空地（第 1 階段：買地）'}</p>
      </div>
      <div class="rules">
        <div>🏷️ 地價 <b>${money(t.price)}</b>　＝ 100%（費用基準）</div>
        <div>${info.fee}：<b>${money(cost)}</b>　＝ 地價的 <b>${stagePct(target)}%</b>（支出）</div>
        <div>💰 過路費：${target === 1
          ? `${money(next)}（地價的 ${rentPct(1)}%）`
          : `${money(now)}（${rentPct(t.stage)}%）→ <b>${money(next)}（${rentPct(target)}%）</b>`}（收入）</div>
        <div>📊 完成後累計投入 <b>${money(nextTotal)}</b>（地價的 ${cumPct}%）</div>
        <div>🏦 你現時現金：<b>${money(p.cash)}</b>${canPay ? '' : '（不足）'}</div>
        ${target >= 2 ? `<div style="color:#c2410c">📐 按「${info.yes}」後<b>先答一題</b>：答對才${info.verb}；答錯就白付 <b>${money(cost)}</b>，地不變</div>` : ''}
      </div>
      <button class="btn" id="invYes" ${canPay ? '' : 'disabled'}>${canPay ? info.yes : '現金不足'}</button>
      <button class="btn alt" id="invNo">${info.no}</button>
    `);

    let done = false;
    $('#invYes').onclick = async () => {
      if (!canPay || done) return;
      done = true;
      $('#invYes').disabled = true;
      closeSheet();

      /* 建屋／升級：先答一題。答對才升級；答錯仍要付該階段費用 */
      let ok = true;
      if (target >= 2) {
        setHint(`<b>${p.name}</b> 要${info.act}「${t.nm}」，先答一題！答對才升級。`);
        const res = await askQuestion({
          kind: 'up', label: info.act, tile: t, who: p.name + ' ' + p.pet, p,
          sub: `答對就${info.act}（付 ${money(cost)}）；答錯仍要付 ${money(cost)}，但不升級`,
          onAnswer: ok2 => ok2
            ? '<div style="margin-top:5px">🎉 ' + info.act + '成功，付出 ' + money(cost) + '。</div>'
            : '<div style="margin-top:5px">💸 ' + info.act + '失敗，但仍要付 ' + money(cost) + '（地沒有升級）。</div>'
        });
        ok = res.ok;
      }

      p.cash -= cost;
      moneyFloat(p.i, -cost);

      if (!ok) {
        SFX.pay();
        renderPlayers();
        logEvent('💸 <b>' + p.name + '</b> 答錯題，「' + t.nm + '」' + info.act + '失敗，仍付出 '
          + money(cost) + '（地價 ' + stagePct(target) + '%）　→ 維持' + (t.stage ? STAGE_NAME[t.stage] : '空地'));
        const tel0 = document.querySelector('.tile[data-i="' + idx + '"]');
        if (tel0) { tel0.classList.add('bounce'); setTimeout(() => tel0.classList.remove('bounce'), 500); }
        resolve(false);
        return;
      }

      if (target === 1) { p.lands.push(idx); }
      else p.build++;
      t.stage = target;
      updateBoard(); renderPlayers();
      if (target === 1) SFX.buy();
      else if (target === 2) SFX.build();
      else SFX.upgrade();
      logEvent(info.mark + ' <b>' + p.name + '</b> ' + info.verb + '「' + t.nm + '」' + money(cost)
        + '（地價 ' + stagePct(target) + '%）　→ 過路費 ' + money(next) + '（' + rentPct(target) + '%）');
      const tel = document.querySelector('.tile[data-i="' + idx + '"]');
      if (tel) { tel.classList.add('bounce'); setTimeout(() => tel.classList.remove('bounce'), 500); }
      resolve(true);
    };
    $('#invNo').onclick = () => { closeSheet(); resolve(false); };
  });
}

/* ---------------- 幸運 / 命運 ---------------- */
function showCard(isLuck, card) {
  return new Promise(resolve => {
    const p = cur();
    if (isLuck) SFX.luck(); else SFX.fate();
    let line = '', color = '#12915a';
    if (typeof card.m === 'number') {
      if (card.m > 0) { gain(p, card.m); line = '+' + card.m + ' 元'; }
      else {
        const sold = payMoney(p, -card.m);
        line = card.m + ' 元';
        color = '#c0263c';
        if (sold.length) line += '（抵押了「' + sold.join('、') + '」）';
      }
    }
    if (card.card) {
      p.cards.push(card.card);
      p.cards.sort((a, b) => a - b);
      renderPlayers();
      line = '獲得 ' + Math.round(card.card * 10) + ' 折卡';
      color = '#1a5fb4';
    }
    logEvent(card.ic + ' <b>' + p.name + '</b> ' + card.t + '　' + line);
    openSheet(`
      <div class="hero">
        <div class="em">${card.ic}</div>
        <h2 style="color:${isLuck ? '#0b8fa5' : '#b0392f'}">${isLuck ? '🍀 幸運' : '🎴 命運'} · ${card.t}</h2>
        <p>${card.d}</p>
        <div class="rules" style="text-align:center;margin:6px 0 4px">
          <div style="font-size:23px;font-weight:800;color:${color}">${line}</div>
          <div style="font-size:11.5px;color:#8aa2b6">${p.name}　${p.pet}</div>
        </div>
      </div>
      <button class="btn" id="cardNext">繼續</button>
    `);
    $('#cardNext').onclick = () => { closeSheet(); resolve(); };
  });
}

/* ---------------- 回合流程 ---------------- */
function rentOf(idx) { return TILES[idx].stage > 0 ? rentAt(TILES[idx], TILES[idx].stage) : 0; }

async function moveSteps(p, n) {
  for (let i = 0; i < n; i++) {
    p.pos = (p.pos + 1) % TILES.length;
    if (p.pos === 0) {
      gain(p, PASS_START);
      setHint(`<b>${p.name}</b> 經過關閘，政府派 $${PASS_START}！`);
    }
    updateTokens();
    await sleep(112);
  }
}

async function landOn(p) {
  const idx = p.pos, t = TILES[idx];

  if (t.t === 'start') {
    setHint(`<b>${p.name}</b> 停在關閘，休息一下。`);
    await sleep(650);
    return;
  }

  if (t.t === 'luck' || t.t === 'fate') {
    const list = t.t === 'luck' ? LUCK : FATE;
    const c = list[(Math.random() * list.length) | 0];
    await showCard(t.t === 'luck', c);
    return;
  }

  const owner = ownerOf(idx);

  if (owner === p.i) {
    const st = t.stage || 1;
    if (st < MAX_STAGE) {
      const target = st + 1;
      const cost = stageCost(t, target);
      if (p.cash >= cost) {
        setHint(`<b>${p.name}</b> 回到「${t.nm}」——第 ${st + 1} 次到訪，可以${STAGE_INFO[target].act}（要先答一題）。`);
        await askInvest(p, idx, t, target);
      } else {
        setHint(`<b>${p.name}</b> 回到「${t.nm}」，但現金不足 $${cost}，暫時未能${STAGE_INFO[target].act}。`);
        await sleep(800);
      }
    } else {
      setHint(`<b>${p.name}</b> 回到「${t.nm}」，已是${STAGE_NAME[MAX_STAGE]}，過路費 $${rentOf(idx)}。`);
      await sleep(700);
    }
    return;
  }

  if (owner === -1) {
    if (p.cash < t.price) {
      setHint(`<b>${p.name}</b> 現金不夠 $${t.price}，錯過「${t.nm}」。`);
      await sleep(750);
      return;
    }
    const res = await askQuestion({
      kind: 'buy', tile: t, who: p.name + ' 搶地', p,
      sub: `答對就可以用 $${t.price} 買下這塊地`,
      onAnswer: ok => ok
        ? '<span class="money">✅ 答對了！可以選擇是否用 $' + t.price + ' 買下這塊地。</span>'
        : '<span class="money">答錯了，這塊地仍然係空地，下次再來。</span>'
    });
    if (res.ok) {
      setHint(`<b>${p.name}</b> 答對了，決定要不要買「${t.nm}」。`);
      await askInvest(p, idx, t, 1);
    }
    return;
  }

  const o = S.players[owner];
  const rent = rentOf(idx);
  await askQuestion({
    kind: 'rent', tile: t, who: '業主 ' + o.name + ' 徵收', p,
    sub: `過路費 $${rent}｜答對可抽打折卡`,
    onAnswer: ok => {
      let mult = 1, tip = '';
      if (ok) {
        const c = [0.5, 0.7, 0.8][(Math.random() * 3) | 0];
        p.cards.push(c);
        p.cards.sort((a, b) => a - b);
        mult = p.cards.shift();
        tip = '抽到 ' + Math.round(mult * 10) + ' 折卡，即刻使用';
      }
      const amt = Math.max(10, Math.round(rent * mult));
      o.cash += amt;
      o.rentIn += amt; p.rentOut += amt;
      const sold = payMoney(p, amt, true);
      renderPlayers();
      moneyFloat(p.i, -amt);
      moneyFloat(o.i, amt);
      flyCoins(p.i, o.i);
      SFX.rent();
      logEvent('💸 <b>' + p.name + '</b> 付 <b>' + o.name + '</b> $' + amt + (ok ? '（打折卡）' : ''));
      return '<span class="money">'
        + (ok ? '🎟️ ' + tip + '｜' : '')
        + '付給 ' + o.name + ' $' + amt + '（原價 $' + rent + '）'
        + (sold.length ? '｜現金不足，抵押了「' + sold.join('、') + '」' : '')
        + '</span>';
    }
  });
}

function nextTurn() {
  S.turn = (S.turn + 1) % 4;
  if (S.turn === 0) {
    S.round++;
    if (S.round > MAX_ROUNDS) { endGame({ type: 'rounds' }); return; }
  }
  renderPlayers();
  setHint(`輪到 <b>${cur().name}</b> ${cur().pet} 擲骰子`);
}

async function doTurn() {
  if (busy || S.over || !S.started) return;
  busy = true;
  $('#rollBtn').disabled = true;

  const p = cur();
  const a = rand6(), b = rand6();
  setHint(`<b>${p.name}</b> 擲出 ${a} + ${b} = ${a + b} 點`);

  await rollDiceAnim(a, b);
  await sleep(160);
  await moveSteps(p, a + b);
  if (!S.over) await landOn(p);

  busy = false;
  if (S.over) return;
  if (S.endAfter) {
    const e = S.endAfter;
    S.endAfter = null;
    endGame(e);
    return;
  }
  nextTurn();
  $('#rollBtn').disabled = false;
}

function paintPicks() {

    const i = +box.dataset.p;
    [...box.children].forEach((b, j) => {
      b.className = picks[i] === j ? 'sel' : (picks.indexOf(j) >= 0 ? 'used' : '');

  const rows = [0, 1, 2, 3].map(i => `

  document.addEventListener('pointerdown', e => {
    if (volpop.classList.contains('on') && !volwrap.contains(e.target)) volpop.classList.remove('on');
  });
  volBgm.addEventListener('input', () => {
    setBgmVol(volBgm.value / 100);
    volBgmN.textContent = volBgm.value;
    if (!bgmPlaying && bgmVol > 0) bgmStart();
  });
  volSfx.addEventListener('input', () => {
    setSfxVol(volSfx.value / 100);
    volSfxN.textContent = volSfx.value;
  });
}

      <p>${S.started && !S.over ? '遊戲進行中' : '4 人 · 每人 $' + START_CASH}</p>
    </div>
    <div class="rules">
      <div>🎲 <b>擲兩顆骰子</b>前進，繞澳門一圈</div>
      <div>📐 全 150 題：<b>2–3 個數</b>之間的簡便運算，先互化（小數 ⇄ 百分數 ⇄ 分數）再巧算（2 個數限時 30 秒、3 個數限時 40 秒）</div>
      <div>🏞️ <b>第 1 次</b>停在空地：答對選擇題，可決定是否<b>買地</b>（地價 $${PRICE_RANGE[1][0]}–$${PRICE_RANGE[5][1]}，名氣愈大愈貴，一律 20 的倍數）</div>
      <div>🏗️ <b>第 2–6 次</b>回到自己的地：可順序<b>建屋 → 普通住宅 → 豪宅 → 商場 → 豪華度假村</b>；<b>每次升級先答一題，答對才升級，答錯仍要付該階段費用</b></div>
      <div style="margin-top:4px">📊 每階段支出與過路費（以<b>地價 = 100%</b> 計）：</div>
      <div class="ptable">
        <div class="ph"><span>階段</span><span>支出</span><span>累計投入</span><span>過路費</span></div>
        <div class="pr"><span>1 只有地權</span><span>100%</span><span>100%</span><span>40%</span></div>
        <div class="pr"><span>2 建屋</span><span>60%</span><span>160%</span><span>75%</span></div>
        <div class="pr"><span>3 普通住宅</span><span>100%</span><span>260%</span><span>115%</span></div>
        <div class="pr"><span>4 豪宅</span><span>150%</span><span>410%</span><span>165%</span></div>
        <div class="pr"><span>5 商場</span><span>200%</span><span>610%</span><span>225%</span></div>
        <div class="pr"><span>6 豪華度假村</span><span><b>260%</b></span><span>870%</span><span><b>300%</b></span></div>
      </div>
      <div><i style="font-style:normal;color:#8aa2b6">例：地價 $400 → 建屋 $240、豪宅 $600、度假村租金 $1,200</i></div>
      <div>💰 停在<b>對手的地</b>：答一題付過路費，答對可抽<b>打折卡</b></div>
      <div>🍀 <b>幸運</b>有錢收、<b>命運</b>會破財；經過關閘派 $${PASS_START}</div>
      <div>💥 現金不足會抵押土地，<b class="m">有人破產即結束</b>；或 ${MAX_ROUNDS} 回合後比總資產</div>
    </div>
    <button class="btn" id="okBtn">${S.started && !S.over ? '返回遊戲' : '返回選角'}</button>
  `);
  $('#okBtn').onclick = () => { if (S.started && !S.over) closeSheet(); else showSetup(); };
}

function startTimer() {
  if (timerId) clearInterval(timerId);
  timerId = setInterval(() => {
    if (!S.started || S.over) return;
    S.elapsed++;
    updateTimer();
  }, 1000);
}

function landValue(p) {
  return p.lands.reduce((s, i) => {
    const t = TILES[i];
    let v = t.price;
    for (let k = 2; k <= (t.stage || 1); k++) v += stageCost(t, k);
    return s + v;
  }, 0);
}

function endGame(e) {
  if (S.over) return;
  S.over = true;
  $('#rollBtn').disabled = true;
  if (timerId) { clearInterval(timerId); timerId = null; }
  if (e.type === 'rounds') SFX.win(); else SFX.pay();

  const qTot = p => p.qOk + p.qNo;
  const acc  = p => qTot(p) ? Math.round(p.qOk / qTot(p) * 100) : 0;

  const ranked = S.players.slice().sort((a, b) => {
    if (a.out !== b.out) return a.out ? 1 : -1;
    return netWorth(b) - netWorth(a);
  });

  /* 數學王：優先取答題 ≥5 題者，正確率最高（同率比答對數） */
  const kPool = S.players.filter(p => qTot(p) >= 5);
  const king = (kPool.length ? kPool : S.players.filter(p => qTot(p) >= 1))
    .sort((a, b) => (acc(b) - acc(a)) || (b.qOk - a.qOk))[0] || null;

  const totalQ = S.players.reduce((s, p) => s + qTot(p), 0);
  const totalOk = S.players.reduce((s, p) => s + p.qOk, 0);
  const totalRent = S.players.reduce((s, p) => s + p.rentIn, 0);
  const rounds = e.type === 'rounds' ? MAX_ROUNDS : Math.max(1, Math.min(S.round - 1, MAX_ROUNDS));

  const title = e.type === 'bankrupt'
    ? '💥 ' + e.who.name + ' 破產！'
    : '🎉 ' + MAX_ROUNDS + ' 個回合完成！';
  const sub = e.type === 'bankrupt'
    ? '現金見底，土地亦抵押光了，第 ' + rounds + ' 回合提早結束，即時結算。'
    : MAX_ROUNDS + ' 回合打完，以總資產（現金 + 地價 + 建築投入）排名。';

  const medal = ['🥇', '🥈', '🥉', '4️⃣'];
  const cards = ranked.map((p, i) => {
    const t = qTot(p);
    return `<div class="scard${i === 0 ? ' win' : ''}${p.out ? ' bust' : ''}">
      <div class="sh">
        <span class="no">${medal[i]}</span>
        <span class="mini" style="--c:${p.color}">${p.pet}</span>
        <span>${p.name}${p.out ? '（破產）' : ''}</span>
        <span class="nv">${money(netWorth(p))}</span>
      </div>
      <div class="sl">
        <span>💵 現金 <b>${money(p.cash)}</b></span>
        <span>🏠 土地 <b>${p.lands.length}</b> 塊</span>
        <span>🏗️ 建築 <b>${p.build}</b> 級</span>
        <span>🏦 地價 <b>${money(landValue(p))}</b></span>
      </div>
      <div class="sl">
        <span>📐 答對 <b>${p.qOk}</b>/${t}${t ? '（' + acc(p) + '%）' : ''}</span>
        <span class="g">收租 +${money(p.rentIn)}</span>
        <span class="r">付租 −${money(p.rentOut)}</span>
      </div>
    </div>`;
  }).join('');

  openSheet(`
    <div class="hero">
      <div class="em">${e.type === 'bankrupt' ? '💥' : '🏆'}</div>
      <h2>${title}</h2>
      <p>${sub}</p>
    </div>
    <div class="statrow">
      <div class="st"><div class="v">${ranked[0].name}</div><div class="l">總資產冠軍</div></div>
      <div class="st"><div class="v">${money(netWorth(ranked[0]))}</div><div class="l">冠軍資產</div></div>
      <div class="st"><div class="v">${king ? king.name : '—'}</div><div class="l">數學王${king ? ' ' + acc(king) + '%' : ''}</div></div>
    </div>
    ${cards}
    <div class="sfoot">
      🏁 共 <b>${rounds}</b> 回合　·　📐 全場答題 <b>${totalQ}</b> 題，答對 <b>${totalOk}</b> 題${totalQ ? '（' + Math.round(totalOk / totalQ * 100) + '%）' : ''}
      <br>💰 全場租金流轉 <b>${money(totalRent)}</b>
    </div>
    <button class="btn" id="againBtn">再玩一次</button>
  `);
  $('#againBtn').onclick = restart;
}

function askRestart() {
  if (!S.started || S.over) { restart(); return; }
  openSheet(`
    <div class="hero">
      <div class="em">🔄</div>
      <h2>重新開始？</h2>
      <p>今局的資金、土地和紀錄會全部清除</p>
    </div>
    <button class="btn" id="yesRestart">確定重來</button>
    <button class="btn alt" id="noRestart">繼續這一局</button>
  `);
  $('#yesRestart').onclick = restart;
  $('#noRestart').onclick = closeSheet;
}

function restart() {
  if (timerId) { clearInterval(timerId); timerId = null; }
  closeSheet();
  newGame();
  updateBoard();
  renderPlayers();
  updateTimer();
  setHint('按「擲骰子」開始');
  $('#rollBtn').disabled = false;
  showSetup();
}

/* ---------------- 初始化 ---------------- */
buildBoard();
makeDie($('#die1'));
makeDie($('#die2'));
setDie($('#die1'), 1);
setDie($('#die2'), 1);
newGame();
updateBoard();
renderPlayers();
updateTimer();
showSetup();

$('#rollBtn').addEventListener('click', doTurn);
$('#btnRules').addEventListener("click", showRules);
$('#btnQR').addEventListener('click', showQR);
$('#btnRestart').addEventListener('click', askRestart);

window.__game = () => ({ S, curAns, TILES, QS });
</script>
</body>
</html>
